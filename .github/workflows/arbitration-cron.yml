name: Arbitration cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/arbitration
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://yessrr.fr/api/cron/arbitration)
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$status_code" -ge 400 ]; then
            echo "Request failed with status $status_code"
            exit 1
          fi

      - name: Call /api/cron/reminders
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://yessrr.fr/api/cron/reminders)
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$status_code" -ge 400 ]; then
            echo "Request failed with status $status_code"
            exit 1
          fi

      - name: Call /api/cron/stripe-connect-reminders
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://yessrr.fr/api/cron/stripe-connect-reminders)
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$status_code" -ge 400 ]; then
            echo "Request failed with status $status_code"
            exit 1
          fi
